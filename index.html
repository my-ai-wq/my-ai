
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My AI - Smart Assistant</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10131c;color:#fff;font-family:Arial,sans-serif}
header{padding:18px;background:#191e2b;border-bottom:1px solid #303747}
header h2{margin:0;color:#75a7ff}
main{max-width:800px;margin:auto;padding:15px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button{background:#28364f;color:white;border:0;padding:12px 15px;border-radius:10px;cursor:pointer}
button:disabled{opacity:.5}
#chat{height:62vh;overflow-y:auto;padding:8px}
.msg{padding:13px 16px;margin:12px 0;border-radius:15px;white-space:pre-wrap;line-height:1.5;max-width:90%;overflow-wrap:anywhere}
.user{background:#2457a6;margin-left:auto}
.ai{background:#252c3b;margin-right:auto}
.inputbox{display:flex;gap:8px;position:sticky;bottom:0;background:#10131c;padding:10px 0}
input{flex:1;min-width:0;background:#252c3b;color:white;border:1px solid #47536b;padding:14px;border-radius:12px}
#send{background:#3979e8}
small{color:#aab5c8}
</style>
</head>
<body>
<header>
<h2>✨ My AI</h2>
<small>Your multilingual AI assistant</small>
</header>
<main>
<div class="controls">
<button onclick="setMode('chat')">💬 Chat</button>
<button onclick="setMode('search')">🌐 Search</button>
<button onclick="setMode('image')">🎨 Image</button>
<button onclick="listen()">🎤 Voice</button>
<button onclick="speakLast()">🔊 Speak</button>
</div>
<small id="status">Mode: Chat</small>
<div id="chat">
<div class="msg ai">Hello! Welcome to My AI. Ask me anything in your language.</div>
</div>
<div class="inputbox">
<input id="message" placeholder="Ask me anything..." onkeydown="if(event.key==='Enter')send()">
<button id="send" onclick="send()">Send</button>
</div>
</main>
<script>
const API_URL="https://my-ai-brain.sandipgarai06369285.workers.dev";
let mode="chat";
let lastReply="";

function setMode(m){
 mode=m;
 document.getElementById("status").textContent="Mode: "+m;
}

function addMessage(text,who){
 const d=document.createElement("div");
 d.className="msg "+who;
 d.textContent=text;
 const chat=document.getElementById("chat");
 chat.appendChild(d);
 chat.scrollTop=chat.scrollHeight;
}

async function send(){
 const input=document.getElementById("message");
 const message=input.value.trim();
 if(!message)return;
 input.value="";
 addMessage(message,"user");
 const btn=document.getElementById("send");
 btn.disabled=true;
 btn.textContent="Thinking...";
 try{
  const response=await fetch(API_URL,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message,mode})
  });
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||"Request failed");
  lastReply=data.reply||data.text||"No response";
  addMessage(lastReply,"ai");
 }catch(e){
  addMessage("Error: "+e.message,"ai");
 }finally{
  btn.disabled=false;
  btn.textContent="Send";
 }
}

function listen(){
 const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SpeechRecognition){
  addMessage("Voice input is not supported. Try Chrome browser.","ai");
  return;
 }
 const rec=new SpeechRecognition();
 rec.lang="bn-IN";
 rec.onresult=e=>{
  document.getElementById("message").value=e.results[0][0].transcript;
 };
 rec.onerror=()=>addMessage("Voice recognition failed. Try again.","ai");
 rec.start();
}

function speakLast(){
 if(!lastReply){
  addMessage("No AI reply to speak yet.","ai");
  return;
 }
 const u=new SpeechSynthesisUtterance(lastReply);
 u.lang="bn-IN";
 speechSynthesis.speak(u);
}
</script>
</body>
</html>
